name: Attach calculator route

on:
  workflow_dispatch: {}

jobs:
  route:
    runs-on: ubuntu-latest
    steps:
      - name: Mint scoped token, attach route, clean up
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          CF="https://api.cloudflare.com/client/v4"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          ZID=$(curl -s -H "$AUTH" "$CF/zones?name=localai.life" | python3 -c "import json,sys; print(json.load(sys.stdin)['result'][0]['id'])")

          curl -s -H "$AUTH" "$CF/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/permission_groups" > /tmp/pg.json
          PGOK=$(python3 -c "import json; print(json.load(open('/tmp/pg.json')).get('success'))")
          if [ "$PGOK" != "True" ]; then
            echo "::error::Cannot list permission groups: $(head -c 250 /tmp/pg.json)"
            exit 1
          fi
          ROUTES_PG=$(python3 -c "import json; d=json.load(open('/tmp/pg.json'))['result']; print(next((g['id'] for g in d if g['name']=='Workers Routes Write'), ''))")
          ZONE_PG=$(python3 -c "import json; d=json.load(open('/tmp/pg.json'))['result']; print(next((g['id'] for g in d if g['name']=='Zone Read'), ''))")
          if [ -z "$ROUTES_PG" ]; then echo "::error::Workers Routes Write group not found"; exit 1; fi

          export ROUTES_PG ZONE_PG ZID
          python3 -c "import json,os; groups=[{'id':os.environ['ROUTES_PG']}]+([{'id':os.environ['ZONE_PG']}] if os.environ.get('ZONE_PG') else []); body={'name':'calculator-route-helper','policies':[{'effect':'allow','resources':{'com.cloudflare.api.account.zone.'+os.environ['ZID']:'*'},'permission_groups':groups}]}; open('/tmp/body.json','w').write(json.dumps(body))"
          curl -s -X POST -H "$AUTH" -H "Content-Type: application/json" "$CF/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens" -d @/tmp/body.json > /tmp/mint.json
          MOK=$(python3 -c "import json; print(json.load(open('/tmp/mint.json')).get('success'))")
          if [ "$MOK" != "True" ]; then
            echo "::error::Token mint failed: $(head -c 300 /tmp/mint.json)"
            exit 1
          fi
          HELPER=$(python3 -c "import json; print(json.load(open('/tmp/mint.json'))['result']['value'])")
          HELPER_ID=$(python3 -c "import json; print(json.load(open('/tmp/mint.json'))['result']['id'])")
          echo "::notice::helper token minted"
          sleep 8

          for PATTERN in "localai.life/calculator*" "www.localai.life/calculator*"; do
            R=$(curl -s -X POST -H "Authorization: Bearer $HELPER" -H "Content-Type: application/json" "$CF/zones/$ZID/workers/routes" -d "{\"pattern\":\"$PATTERN\",\"script\":\"calculator-site\"}")
            echo "::notice::route $PATTERN: $(echo "$R" | head -c 250)"
          done

          curl -s -X DELETE -H "$AUTH" "$CF/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/$HELPER_ID" > /dev/null
          echo "::notice::helper token destroyed"

          CODE=000
          for i in $(seq 1 10); do
            CODE=$(curl -s -o /tmp/page.html -w "%{http_code}" "https://localai.life/calculator/" || echo err)
            if [ "$CODE" = "200" ]; then break; fi
            sleep 15
          done
          echo "::notice::https://localai.life/calculator/ -> HTTP $CODE"
          echo "::notice::body starts: $(head -c 150 /tmp/page.html | tr -d '\n')"
