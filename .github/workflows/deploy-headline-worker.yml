name: Deploy headline lab worker

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Ensure KV namespace
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          CF="https://api.cloudflare.com/client/v4"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          KV_ID=$(curl -s -H "$AUTH" "$CF/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces?per_page=100" \
            | python3 -c "import json,sys; r=json.load(sys.stdin).get('result') or []; m=[n for n in r if n['title']=='headline-lab-pool']; print(m[0]['id'] if m else '')")
          if [ -z "$KV_ID" ]; then
            KV_ID=$(curl -s -X POST -H "$AUTH" -H "Content-Type: application/json" \
              "$CF/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces" -d '{"title":"headline-lab-pool"}' \
              | python3 -c "import json,sys; print(json.load(sys.stdin)['result']['id'])")
            echo "created KV namespace"
          fi
          [ -n "$KV_ID" ] || { echo "::error::could not resolve KV namespace"; exit 1; }
          sed -i "s/__KV_ID__/$KV_ID/" headline-worker/wrangler.toml

      - name: Deploy worker
        working-directory: headline-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          if ! npx --yes wrangler@4 deploy 2>&1 | tee deploy.log; then
            grep -iE 'error|fail|auth|token|denied' deploy.log | head -8 | while read -r l; do echo "::error::wrangler: $l"; done
            exit 1
          fi
          URL=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          [ -n "$URL" ] || { echo "::error::could not detect worker URL"; exit 1; }
          echo "WORKER_URL=$URL" >> "$GITHUB_ENV"
          echo "::notice::worker url: $URL"

      - name: Set worker secrets
        working-directory: headline-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          HEADLINE_PASSCODE: ${{ secrets.HEADLINE_PASSCODE }}
        run: |
          printf '%s' "$ANTHROPIC_API_KEY" | npx --yes wrangler@4 secret put ANTHROPIC_API_KEY
          printf '%s' "$HEADLINE_PASSCODE" | npx --yes wrangler@4 secret put HEADLINE_PASSCODE

      - name: Smoke test
        env:
          HEADLINE_PASSCODE: ${{ secrets.HEADLINE_PASSCODE }}
        run: |
          for i in $(seq 1 20); do
            S=$(curl -s -o /tmp/list.json -w "%{http_code}" "$WORKER_URL/articles" || echo err)
            [ "$S" = "200" ] && break
            echo "attempt $i: $S, waiting for SSL"; sleep 20
          done
          echo "::notice::list articles [$S]: $(head -c 200 /tmp/list.json 2>/dev/null)"
          [ "$S" = "200" ]
          G=$(curl -s -o /tmp/gen.json -w "%{http_code}" -X POST "$WORKER_URL/generate" -H "X-Passcode: $HEADLINE_PASSCODE")
          echo "::notice::generate [$G]: $(head -c 300 /tmp/gen.json 2>/dev/null)"
          [ "$G" = "200" ]
          B=$(curl -s -o /tmp/bad.json -w "%{http_code}" -X POST "$WORKER_URL/generate" -H "X-Passcode: wrong")
          echo "::notice::bad passcode check [$B] (expect 401)"
          [ "$B" = "401" ]
