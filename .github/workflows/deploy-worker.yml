name: Deploy lookup worker

on:
  workflow_dispatch:
    inputs:
      worker_url:
        description: "Already deployed? Paste the worker URL here to skip deploy and just wire it into the site."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Deploy worker to Cloudflare
        if: ${{ inputs.worker_url == '' }}
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN repo secret. Create one at dash.cloudflare.com > My Profile > API Tokens using the 'Edit Cloudflare Workers' template."
            exit 1
          fi
          # ensure the account has a workers.dev subdomain (one-time on new accounts)
          SUB=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print((d.get('result') or {}).get('subdomain') or '')")
          if [ -z "$SUB" ]; then
            for CAND in localairegistry localairegistry-app lar-$(echo $CLOUDFLARE_ACCOUNT_ID | cut -c1-6); do
              R=$(curl -s -X PUT -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" \
                "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
                -d "{\"subdomain\":\"$CAND\"}")
              OK=$(echo "$R" | python3 -c "import json,sys; print(json.load(sys.stdin).get('success'))")
              if [ "$OK" = "True" ]; then echo "Registered workers.dev subdomain: $CAND"; SUB=$CAND; break; fi
              echo "Subdomain $CAND unavailable, trying next"
            done
          fi
          if [ -z "$SUB" ]; then echo "::error::Could not register a workers.dev subdomain."; exit 1; fi
          set -o pipefail
          if ! npx --yes wrangler@4 deploy 2>&1 | tee deploy.log; then
            grep -iE 'error|fail|auth|token|denied|code' deploy.log | head -8 | while read -r l; do echo "::error::wrangler: $l"; done
            exit 1
          fi
          URL=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          if [ -z "$URL" ]; then
            tail -8 deploy.log | while read -r l; do echo "::error::wrangler: $l"; done
            echo "::error::Could not detect worker URL from wrangler output."
            exit 1
          fi
          echo "WORKER_URL=$URL" >> "$GITHUB_ENV"

      - name: Set worker AHREFS_API_KEY secret
        if: ${{ inputs.worker_url == '' }}
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AHREFS_API_KEY: ${{ secrets.AHREFS_API_KEY }}
        run: |
          if [ -z "$AHREFS_API_KEY" ]; then
            echo "::error::Missing AHREFS_API_KEY repo secret (same one the monthly refresh uses)."
            exit 1
          fi
          printf '%s' "$AHREFS_API_KEY" | npx --yes wrangler@4 secret put AHREFS_API_KEY

      - name: Deploy calculator proxy and attach localai.life
        if: ${{ inputs.worker_url == '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          CF="https://api.cloudflare.com/client/v4"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          ZID=$(curl -s -H "$AUTH" "$CF/zones?name=localai.life" | python3 -c "import json,sys; r=json.load(sys.stdin)['result']; print(r[0]['id'] if r else '')")
          if [ -z "$ZID" ]; then echo "::warning::localai.life zone not found, skipping"; exit 0; fi
          # remove placeholder AAAA records so custom domain attachment can create its own
          for NAME in localai.life www.localai.life; do
            curl -s -H "$AUTH" "$CF/zones/$ZID/dns_records?name=$NAME&type=AAAA&content=100::"               | python3 -c "import json,sys; [print(r['id']) for r in json.load(sys.stdin)['result']]"               | while read -r RID; do
                  curl -s -X DELETE -H "$AUTH" "$CF/zones/$ZID/dns_records/$RID" > /dev/null
                  echo "removed placeholder record on $NAME"
                done
          done
          cd worker/proxy
          set -o pipefail
          if ! npx --yes wrangler@4 deploy 2>&1 | tee proxy.log; then
            grep -iE 'error|fail|auth|denied' proxy.log | head -6 | while read -r l; do echo "::error::proxy: $l"; done
            exit 1
          fi
          for HOST in localai.life www.localai.life; do
            R=$(curl -s -X PUT -H "$AUTH" -H "Content-Type: application/json" "$CF/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains"               -d "{\"zone_id\":\"$ZID\",\"hostname\":\"$HOST\",\"service\":\"calculator-site\",\"environment\":\"production\"}")
            OK=$(echo "$R" | python3 -c "import json,sys; print(json.load(sys.stdin).get('success'))")
            echo "::notice::custom domain $HOST attach: $OK $(echo "$R" | python3 -c "import json,sys; d=json.load(sys.stdin); print('' if d.get('success') else json.dumps(d.get('errors'))[:200])")"
          done
          for i in $(seq 1 12); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://localai.life/calculator/" || echo err)
            [ "$CODE" = "200" ] && break
            echo "waiting for localai.life ($CODE), retry $i"; sleep 20
          done
          echo "::notice::localai.life/calculator/ -> HTTP $CODE"

      - name: Use provided URL instead
        if: ${{ inputs.worker_url != '' }}
        run: echo "WORKER_URL=${{ inputs.worker_url }}" >> "$GITHUB_ENV"

      - name: Wire worker URL into index.html
        run: |
          node -e '
            const fs = require("fs");
            const url = process.env.WORKER_URL.replace(/\/+$/, "");
            let html = fs.readFileSync("index.html", "utf8");
            const re = /window\.AHREFS_LOOKUP_URL = "[^"]*";/;
            if (!re.test(html)) { console.error("Config line not found"); process.exit(1); }
            html = html.replace(re, `window.AHREFS_LOOKUP_URL = "${url}";`);
            fs.writeFileSync("index.html", html);
            console.log("Wired:", url);
          '

      - name: Commit and push if changed
        run: |
          git config user.name "worker-deploy-bot"
          git config user.email "actions@github.com"
          if git diff --quiet; then
            echo "index.html already pointed at this worker URL."
          else
            git add index.html
            git commit -m "chore: wire live lookup worker URL into calculator"
            git push
          fi

      - name: Smoke test
        run: |
          # new workers.dev subdomains can take a few minutes to provision SSL
          for i in $(seq 1 20); do
            STATUS=$(curl -s -o /tmp/resp.json -w "%{http_code}" "$WORKER_URL/?kw=lip%20flip%20near%20me" -H "Origin: https://seo-platform-x.github.io" || echo "curl-err")
            [ "$STATUS" = "200" ] && break
            echo "attempt $i: $STATUS, waiting 30s for SSL provisioning"
            sleep 30
          done
          echo "keyword lookup: HTTP $STATUS"
          echo "::notice::keyword lookup [$STATUS]: $(cat /tmp/resp.json 2>/dev/null | head -c 300)"
          [ "$STATUS" = "200" ]
          PSTATUS=$(curl -s -o /tmp/profile.json -w "%{http_code}" "$WORKER_URL/profile?domain=sanantonio-lasik.com" -H "Origin: https://seo-platform-x.github.io")
          echo "profile: HTTP $PSTATUS"
          echo "::notice::profile [$PSTATUS]: $(cat /tmp/profile.json 2>/dev/null | head -c 500)"
          [ "$PSTATUS" = "200" ]
