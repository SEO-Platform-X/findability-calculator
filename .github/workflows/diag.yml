name: diag
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: |
          for d in amazon.com quiktox.com; do
            R=$(curl -s "https://findability-lookup.localairegistry.workers.dev/profile?domain=$d")
            echo "::notice::$d :: $(echo "$R" | head -c 300)"
          done
