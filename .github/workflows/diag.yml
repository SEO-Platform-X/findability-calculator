name: Diagnostics

on:
  workflow_dispatch: {}

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Ahrefs organic-keywords variants
        env:
          AHREFS_API_KEY: ${{ secrets.AHREFS_API_KEY }}
        run: |
          D=$(date -u -d "4 days ago" +%Y-%m-%d)
          probe () {
            NAME="$1"; shift
            BODY=$(curl -s -w "\n%{http_code}" -H "Authorization: Bearer $AHREFS_API_KEY" "https://api.ahrefs.com/v3/site-explorer/organic-keywords?$1")
            CODE=$(echo "$BODY" | tail -1)
            JSON=$(echo "$BODY" | head -c 700)
            echo "::notice::[$NAME] HTTP $CODE :: $JSON"
          }
          probe "v4-ahrefs-free" "target=ahrefs.com&mode=subdomains&country=us&date=$D&select=keyword,volume,best_position&order_by=volume:desc&limit=3&output=json"
          probe "v5-vancethompson" "target=vancethompsonvision.com&mode=subdomains&country=us&date=$D&select=keyword,volume&limit=3&output=json"
          probe "v6-parkhurst-www" "target=www.parkhurstnuvision.com&mode=exact&country=us&date=$D&select=keyword,volume&limit=3&output=json"

      - name: Cloudflare DNS and token introspection
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          CF="https://api.cloudflare.com/client/v4"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          ZID=$(curl -s -H "$AUTH" "$CF/zones?name=localai.life" | python3 -c "import json,sys; print(json.load(sys.stdin)['result'][0]['id'])")
          echo "::notice::[dns-records] $(curl -s -H "$AUTH" "$CF/zones/$ZID/dns_records" | python3 -c "import json,sys; d=json.load(sys.stdin); print(json.dumps({'success': d.get('success'), 'errors': d.get('errors'), 'records': [{'type':r['type'],'name':r['name'],'content':r['content'][:60]} for r in (d.get('result') or [])]}))" | head -c 700)"
          echo "::notice::[token-verify] $(curl -s -H "$AUTH" "$CF/user/tokens/verify" | head -c 300)"
          echo "::notice::[perm-check-write] $(curl -s -X POST -H "$AUTH" -H "Content-Type: application/json" "$CF/zones/$ZID/dns_records" -d '{"type":"TXT","name":"_claude-perm-check.localai.life","content":"probe"}' | head -c 300)"
