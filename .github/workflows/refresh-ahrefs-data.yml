name: Refresh Ahrefs data

on:
  schedule:
    # Ahrefs monthly volumes settle early in the month; run on the 5th at 15:00 UTC (8am PT)
    - cron: "0 15 5 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch live data and patch calculator
        env:
          AHREFS_API_KEY: ${{ secrets.AHREFS_API_KEY }}
        run: node scripts/refresh-data.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "ahrefs-refresh-bot"
          git config user.email "actions@github.com"
          if git diff --quiet; then
            echo "No data changes this month."
          else
            git add index.html data/latest.json
            git commit -m "chore: refresh Ahrefs data ($(date -u +%b\ %Y))"
            git push
          fi
