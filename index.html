    header.parentNode.insertBefore(bar, header.nextSibling);

    var input = document.getElementById("site-analyzer-input");
    var btn = document.getElementById("site-analyzer-btn");
    var status = document.getElementById("site-analyzer-status");

    var retried = false;
    function run() {
      var domain = input.value.trim().toLowerCase().replace(/^https?:\/\//, "").replace(/^www\./, "").split("/")[0];
      if (!domain || domain.indexOf(".") === -1) { status.textContent = "Enter a domain like yourpractice.com"; return; }
      btn.disabled = true;
      status.textContent = "Analyzing " + domain + "\u2026 checking what you rank for (takes a few seconds)";
      fetch(BASE + "/profile?domain=" + encodeURIComponent(domain))
        .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
        .then(function (res) {
          btn.disabled = false;
          if (!res.ok) {
            if (res.j && res.j.error === "rate limited") {
              status.textContent = "Too many analyses from this connection. Try again in an hour.";
            } else if (res.j && res.j.error === "invalid domain") {
              status.textContent = "That does not look like a domain. Try the format yourpractice.com";
            } else if (!retried) {
              retried = true;
              status.textContent = "Search data provider is busy, retrying\u2026";
              setTimeout(run, 2500);
            } else {
              status.textContent = "The data provider is rate limiting right now. Give it a minute and hit Analyze again.";
            }
            return;
          }
          retried = false;
          var p = res.j;
          if (!p.ranking_keywords) {
            status.textContent = domain + " has no measurable US rankings yet, which itself is a findability signal. Explore the categories below.";
            return;
          }
          var parts = [];
          if (p.vertical) {
            var tab = findButtonByText(p.vertical);
            if (tab) tab.click();
            parts.push("Detected: " + p.vertical);
          } else if (p.category) {
            parts.push("Detected: " + titleCase(p.category.replace(/_/g, " ")) + " \u00B7 your top ranking keywords loaded below");
          }
          if (p.city) parts.push(titleCase(p.city));
          parts.push(p.ranking_keywords + " ranking keywords found");
          status.textContent = parts.join(" \u00B7 ");

          var toAdd = (p.keywords || []).slice(0, 3).map(function (k) { return k.keyword; });
          var i = 0;
          setTimeout(function next() {
            if (i >= toAdd.length) return;
            addCluster(toAdd[i++], next);
          }, 500);
        })
        .catch(function () {
          btn.disabled = false;
          status.textContent = "Analysis service unreachable. Try again shortly.";
        });
    }
    btn.addEventListener("click", run);
    input.addEventListener("keydown", function (e) {
      if (e.key === "Enter") { hideSuggest(); run(); }
      if (e.key === "Escape") hideSuggest();
    });

    var suggest = document.getElementById("site-analyzer-suggest");
    var debounceTimer = null;
    function hideSuggest() { suggest.style.display = "none"; suggest.innerHTML = ""; }
    function showSuggestions(items, q) {
      var guess = q.toLowerCase().replace(/[^a-z0-9]/g, "") + ".com";
      var list = items.slice(0, 4);
      if (!list.some(function (it) { return it.domain === guess; })) {
        list.push({ name: "Analyze \u201C" + guess + "\u201D", domain: guess, logo: "" });
      }
      suggest.innerHTML = "";
      list.forEach(function (it) {
        var row = document.createElement("div");
        row.style.cssText = "display:flex;align-items:center;gap:10px;padding:9px 12px;cursor:pointer;font-size:14px;";
        row.onmouseenter = function () { row.style.background = "#F3F5F2"; };
        row.onmouseleave = function () { row.style.background = "#fff"; };
        var img = document.createElement("img");
        img.src = it.logo || "";
        img.style.cssText = "width:20px;height:20px;border-radius:4px;flex:none;";
        img.onerror = function () { img.style.display = "none"; };
        var name = document.createElement("span");
        name.textContent = it.name;
        name.style.cssText = "color:#14232B;font-weight:600;";
        var dom = document.createElement("span");
        dom.textContent = it.domain;
        dom.style.cssText = "color:#8B978F;font-size:12px;margin-left:auto;";
        row.appendChild(img); row.appendChild(name); row.appendChild(dom);
        row.addEventListener("mousedown", function (e) {
          e.preventDefault();
          input.value = it.domain;
          hideSuggest();
          run();
        });
        suggest.appendChild(row);
      });
      suggest.style.display = "block";
    }
    input.addEventListener("input", function () {
      var q = input.value.trim();
      clearTimeout(debounceTimer);
      if (q.length < 2 || q.indexOf(".") !== -1) { hideSuggest(); return; }
      debounceTimer = setTimeout(function () {
        fetch("https://autocomplete.clearbit.com/v1/companies/suggest?query=" + encodeURIComponent(q))
          .then(function (r) { return r.ok ? r.json() : []; })
          .then(function (items) { if (input.value.trim() === q) showSuggestions(items || [], q); })
          .catch(function () { if (input.value.trim() === q) showSuggestions([], q); });
      }, 220);
    });
    input.addEventListener("blur", function () { setTimeout(hideSuggest, 150); });
  });
})();
</script>

</body>
</html>
